name: CI

on:
  push:
  pull_request:
  schedule:
    # Mondays. A failed scheduled run emails the repo owner: the content needs a re-check.
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/
      - name: Content freshness
        if: github.event_name == 'schedule'
        run: node scripts/check-fresh.js
